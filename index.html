<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motos González | Concesionario Multi-Marca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #000; font-family: sans-serif; overflow-x: hidden; }
        .view { display: none; min-height: 100vh; }
        .view.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card-moto { transition: transform 0.3s ease; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .card-moto:hover { transform: translateY(-10px); border-color: #ef4444; background: rgba(255,255,255,0.02); }
    </style>
</head>
<body class="text-white">

    <nav class="fixed top-0 w-full z-50 bg-black/80 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div onclick="irA('inicio')" class="text-2xl font-black cursor-pointer italic uppercase tracking-tighter">MOTOS <span class="text-red-600">GONZÁLEZ</span></div>
            <div class="flex gap-4">
                <a href="https://www.rieju.es" target="_blank" class="bg-red-600 px-5 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest hover:bg-red-700 transition shadow-lg shadow-red-600/20">Web Rieju</a>
                <a href="https://www.kymco.es" target="_blank" class="bg-blue-600 px-5 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest hover:bg-blue-700 transition shadow-lg shadow-blue-600/20">Web Kymco</a>
            </div>
        </div>
    </nav>

    <div id="inicio" class="view active pt-24 px-6 pb-20">
        <div class="max-w-7xl mx-auto text-center mb-20">
            <h1 class="text-6xl md:text-8xl font-black italic mb-6 uppercase leading-none">EL PODER EN <br><span class="text-red-600">TUS MANOS</span></h1>
            <p class="text-gray-400 text-xl mb-12 max-w-2xl mx-auto">Explora la gama completa de Rieju y Kymco 2026.</p>
            
            <div class="flex flex-col md:flex-row gap-8 justify-center mb-24">
                <div onclick="irA('rieju')" class="group relative cursor-pointer overflow-hidden rounded-[2.5rem] h-64 w-full md:w-80 bg-zinc-900 border border-white/10 flex items-center justify-center">
                    <span class="text-5xl font-black italic group-hover:scale-110 transition duration-500 z-10">CATÁLOGO RIEJU</span>
                    <div class="absolute inset-0 bg-gradient-to-t from-red-600/40 to-transparent group-hover:bg-red-600/60 transition"></div>
                </div>
            </div>

            <div class="max-w-5xl mx-auto">
                <h2 class="text-3xl font-black italic uppercase mb-6 text-left border-l-4 border-red-600 pl-4">Dónde estamos</h2>
                <div class="rounded-[2.5rem] overflow-hidden border border-white/10 h-96 shadow-2xl">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3100.23456789!2d-1.85!3d38.99!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzhuNTknMjQuMCJOIDHCsDUxJzAwLjAiVw!5e0!3m2!1ses!2ses!4v1713550000000!5m2!1ses!2ses" 
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
                    </iframe>
                </div>
                <p class="mt-4 text-gray-500 font-bold uppercase tracking-widest text-sm">Albacete, España</p>
            </div>
        </div>
    </div>

    <div id="rieju" class="view pt-24 px-6 pb-20">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-end mb-12">
                <h2 class="text-6xl font-black italic text-red-600 uppercase">Gama Rieju</h2>
                <button onclick="irA('inicio')" class="text-xs font-bold underline uppercase text-gray-500">Volver</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <script>
                    const motos = [
                        {id: 'tango125', n: 'Tango 125i', f: 'tango125l.jpg'},
                        {id: 'mrt125europa', n: 'Marathon 125 Europa', f: 'mrt125smeuropa.jpg'},
                        {id: 'mrt125smpro', n: 'Marathon 125 SM Pro', f: 'mrt125smpro.jpg'},
                        {id: 'mrt50', n: 'MRT 50', f: 'mrt50.jpg'},
                        {id: 'mrt50pro', n: 'MRT 50 Pro', f: 'mrt50pro.jpg'},
                        {id: 'mrt50sm', n: 'MRT 50 SM', f: 'mrt50sm.jpg'},
                        {id: 'mrt50smpro', n: 'MRT 50 SM Pro', f: 'mrt50smpro.jpg'},
                        {id: 'mrt125pro', n: 'Marathon 125 Pro', f: 'mrt125pro125.jpg'},
                        {id: 'mrt125e', n: 'Marathon 125 Europa', f: 'mrt125europa.jpg'},
                        {id: 'rally307r', n: 'Aventura Rally 307R', f: 'aventurarally307rroja.jpg'},
                        {id: 'rally307', n: 'Aventura Rally 307', f: 'aventurarally307roja.jpg'},
                        {id: 'mr300racing', n: 'MR Racing 300i', f: 'mrracing300iroja.jpg'},
                        {id: 'mr300pro', n: 'MR Pro 300i', f: 'mrpro300iroja.jpg'},
                        {id: 'mr125pro', n: 'MR 125 Pro', f: 'mr125proroja.jpg'}
                    ];

                    motos.forEach(m => {
                        document.write(`
                            <div onclick="abrirAmazon('${m.id}')" class="card-moto bg-zinc-900 p-4 rounded-[2rem]">
                                <div class="bg-white rounded-2xl h-48 flex items-center justify-center p-4 mb-4">
                                    <img src="${m.f}" class="max-h-full object-contain">
                                </div>
                                <h3 class="font-bold uppercase text-[10px]">${m.n}</h3>
                                <p class="text-red-500 font-black text-xs">Consultar Precio</p>
                            </div>
                        `);
                    });
                </script>
            </div>
        </div>
    </div>

    <div id="modal-amazon" class="hidden fixed inset-0 z-[100] bg-black/95 backdrop-blur-xl flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-white/10 rounded-[3rem] max-w-5xl w-full flex flex-col md:flex-row overflow-hidden relative shadow-2xl animate-in zoom-in duration-300">
            <button onclick="cerrarAmazon()" class="absolute top-6 right-6 text-white text-3xl font-black bg-red-600 w-12 h-12 rounded-full flex items-center justify-center hover:rotate-90 transition-all z-10">&times;</button>
            <div class="md:w-1/2 bg-white p-10 flex items-center justify-center">
                <img id="modal-img" src="" class="max-h-[400px] w-full object-contain drop-shadow-2xl">
            </div>
            <div class="md:w-1/2 p-10 flex flex-col justify-center">
                <h2 id="modal-title" class="text-5xl font-black italic uppercase mb-6 tracking-tighter">MOTO</h2>
                <div class="bg-black/50 p-8 rounded-3xl border border-white/5 mb-6">
                    <p class="text-[10px] font-bold text-red-600 uppercase mb-4">Gama Oficial 2026</p>
                    <ul class="text-gray-300 text-sm space-y-2">
                        <li>• Motor de alto rendimiento</li>
                        <li>• Suspensión deportiva</li>
                        <li>• Garantía oficial de marca</li>
                    </ul>
                </div>
                <a href="https://wa.me/34600000000" class="bg-green-600 text-white py-5 rounded-2xl font-black text-center uppercase">WhatsApp Stock</a>
            </div>
        </div>
    </div>

    <script>
        function irA(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        function abrirAmazon(id) {
            const moto = motos.find(m => m.id === id);
            document.getElementById('modal-img').src = moto.f;
            document.getElementById('modal-title').innerText = moto.n;
            document.getElementById('modal-amazon').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function cerrarAmazon() {
            document.getElementById('modal-amazon').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
